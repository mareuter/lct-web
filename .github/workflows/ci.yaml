name: "Python CI"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"

jobs:
  ci:
    strategy:
      matrix:
        python:
          - "3.11"
          - "3.12"
    uses: mareuter/shared-workflows/.github/workflows/uv-python-ci.yaml@4d3ff44bf28704bf797800a3ca3b14cdbec37066 # main
    with:
      python-version: ${{ matrix.python }}
