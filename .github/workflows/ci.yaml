name: "Python CI"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"

jobs:
  ci:
    strategy:
      matrix:
        python:
          - "3.11"
          - "3.12"
    uses: mareuter/shared-workflows/.github/workflows/uv-python-ci.yaml@6842eb7a58bbb8ac3a3620df50eb0c1973a72a51 # main
    with:
      python-version: ${{ matrix.python }}
