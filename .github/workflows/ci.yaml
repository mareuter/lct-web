name: "Python CI"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"

jobs:
  ci:
    strategy:
      matrix:
        python:
          - "3.11"
          - "3.12"
    uses: mareuter/shared-workflows/.github/workflows/uv-python-ci.yaml@000c2e87f2db458d85ac65dd58451af4989c19dd # main
    with:
      python-version: ${{ matrix.python }}
